<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InTire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets\style.css">
</head>

<script>
    document.querySelector('.btn-signup').addEventListener('click', function () {
        this.classList.toggle('clicked');
    });
</script>

<body>
    <div class="text-center mt-5 pt-5">
        <img src="assets/img/InTire.svg" alt="InTire" class="img-fluid pb-2">

        <p class="text-center hero-subtitle">Tire defect inspection using Deep Learning and<br>
        CNN-Powered Image Detection</p>
    </div>

    <hr class="divider">

    <div class="get-started">
        <p class="text-center mb-2 get-started-title">Get Started</p>
        <p class="text-center mb-4 get-started-subtitle">Choose your access method</p>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col px-5 pt-2">
                <a href="signIn.html" class="btn btn-lg w-100 mb-3 btn-signin">Sign In</a>

                <a href="signUp.html" class="btn btn-outline btn-lg w-100 btn-signup">Sign Up</a>

                <p class="text-center m-3 or-separator">Or</p>

                <div class="position-relative guest-btn-wrap" id="guestBtnWrap">
                    <button type="button" class="btn btn-outline btn-lg w-100 btn-guest" id="guestBtn" disabled
                        title="Accept the Terms and Conditions and Privacy Policy below to continue">Continue as Guest</button>
                    <div id="guestBtnBlocker" class="guest-btn-blocker position-absolute top-0 start-0 w-100 h-100 rounded-3"
                        aria-hidden="true"></div>
                </div>
                <div id="guestAgreementReminder" class="alert alert-warning py-2 small text-center mt-2 mb-0 d-none"
                    role="alert">Please accept both the Terms and Conditions and the Privacy Policy below before
                    continuing as a guest.</div>

                <div class="mt-3 py-3 px-4 agreement-box">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="check1">
                        <label class="form-check-label" for="check1" style="font-size:0.9rem;">
                            I agree to the <a href="termsAndConditions.html" class="agreement-link">Terms and Conditions</a>
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="check2">
                        <label class="form-check-label" for="check2" style="font-size:0.9rem;">
                            I agree to the <a href="privacyPolicy.html" class="agreement-link">Privacy Policy</a>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <hr class="divider">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const API_BASE = "http://127.0.0.1:5000";
        const guestBtn = document.getElementById("guestBtn");
        const guestBtnWrap = document.getElementById("guestBtnWrap");
        const guestBtnBlocker = document.getElementById("guestBtnBlocker");
        const guestAgreementReminder = document.getElementById("guestAgreementReminder");
        const termsCheck = document.getElementById("check1");
        const privacyCheck = document.getElementById("check2");

        let guestReminderHideTimer;

        function hideGuestAgreementReminder() {
            if (!guestAgreementReminder) return;
            guestAgreementReminder.classList.add("d-none");
            clearTimeout(guestReminderHideTimer);
        }

        function syncGuestButton() {
            if (!guestBtn || !termsCheck || !privacyCheck) return;
            const bothAccepted = termsCheck.checked && privacyCheck.checked;
            guestBtn.disabled = !bothAccepted;
            guestBtn.title = bothAccepted
                ? ""
                : "Accept the Terms and Conditions and Privacy Policy below to continue";
            if (guestBtnWrap) guestBtnWrap.classList.toggle("guest-ready", bothAccepted);
            if (bothAccepted) hideGuestAgreementReminder();
        }

        if (guestBtnBlocker && guestAgreementReminder) {
            guestBtnBlocker.addEventListener("click", () => {
                if (guestBtnWrap && guestBtnWrap.classList.contains("guest-ready")) return;
                guestAgreementReminder.classList.remove("d-none");
                clearTimeout(guestReminderHideTimer);
                guestReminderHideTimer = setTimeout(hideGuestAgreementReminder, 6000);
            });
        }

        if (termsCheck && privacyCheck) {
            termsCheck.addEventListener("change", syncGuestButton);
            privacyCheck.addEventListener("change", syncGuestButton);
            syncGuestButton();
        }

        if (guestBtn) {
            guestBtn.addEventListener("click", async () => {
                try {
                    const res = await fetch(`${API_BASE}/guest-session`, {
                        method: "POST",
                        credentials: "include"
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data.success) throw new Error("Guest session failed");
                    window.location.href = "intro.html";
                } catch (e) {
                    console.error(e);
                    window.location.href = "intro.html";
                }
            });
        }
    </script>
</body>

</html>
